[package]
name = "plugwarden-core-wasm"
version = "0.0.0"
description = "Plugwarden crypto core: KDF, unlock, batch cipher decrypt/encrypt, TOTP, generator"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Account registration helpers (user key + RSA key pair). Used by the e2e harness only.
register = []

[dependencies]
# base64 and zeroize are already in the tree through bitwarden-crypto (no size cost).
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# Pinned to upstream.lock [sdk-internal].rev. Bump only via tools/sync-upstream + CI.
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "d7ab9964cd0b10db346d0418dba065969663bdcb", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.13.0"
serde_json = { version = "1", default-features = false, features = ["std"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
wasm-bindgen = { version = "=0.2.114", default-features = false }
zeroize = "1"

# bitwarden-crypto does not compile for wasm32 without its `wasm` feature (stream/large_memory_buffer.rs uses js-sys).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "d7ab9964cd0b10db346d0418dba065969663bdcb", default-features = false, features = ["wasm"] }

[dev-dependencies]
serde_json = "1"
