[package]
name = "autofill-core"
version = "0.0.0"
description = "WebAssembly surface of the autofill engine: no keys and no secret values ever enter it"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
autofill-cpd.workspace = true
autofill-resolver.workspace = true
autofill-fill.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { version = "=0.2.114", default-features = false }
