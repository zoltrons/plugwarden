# Upstream path -> local module that mirrors it. Read by tools/sync-upstream (Phase 1) to build a
# diff report between the pins in upstream.lock and upstream main. Never edits code.
# repo keys match upstream.lock sections.

- repo: sdk-internal
  path: crates/bitwarden-crypto
  local: crates/core-wasm (Cargo git dep)
  sync: Bumped as a dependency, not mirrored. Watch EncString types, key formats (COSE/v2), KDF params.
- repo: sdk-internal
  path: test-vectors
  local: crates/core-wasm/tests/vectors.rs
  sync: New vector files or fields must pass; blob-encrypted ciphers are currently skipped.
- repo: sdk-internal
  path: crates/bitwarden-vault/src/cipher
  local: crates/core-wasm/src/cipher.rs
  sync: Encrypted field list (CONTAINERS / PLAIN_KEYS); new cipher types; cipher key and blob ("data") formats.
- repo: sdk-internal
  path: crates/bitwarden-vault/src/totp.rs
  local: crates/core-wasm/src/totp.rs
  sync: URI formats, defaults, clamping.
- repo: sdk-internal
  path: crates/bitwarden-generators/src
  local: crates/core-wasm/src/generator.rs
  sync: Character sets, option defaults and bounds, wordlist.
- repo: sdk-internal
  path: crates/bitwarden-wasm-internal/build.sh
  local: tools/build-wasm.sh
  sync: wasm-bindgen version, target features (SIMD), wasm-opt flags.
- repo: clients
  path: libs/tools/generator/core/src/integration
  local: src/shared/alias.ts, src/background/alias.ts
  sync: Forwarder create-alias request (URL, auth header, body, response field) and the settings each service reads; a new vendor touches ALIAS_INFO, the message validators and the generator UI.
- repo: clients
  path: apps/browser/src/manifest.v3.json
  local: src/manifest.json
  sync: Permissions, CSP, minimum_chrome_version, commands.
- repo: clients
  path: apps/browser/src/autofill/content
  local: src/autofill (Phase 3)
  sync: Field detection heuristics, performance notes.
- repo: clients
  path: apps/browser/src/platform/offscreen-document
  local: src/offscreen
  sync: Offscreen reasons and lifecycle.
- repo: clients
  path: libs/common/src/platform/services/api.service.ts
  local: src/transport/http.ts
  sync: Client headers (Bitwarden-Client-Name/Version, Device-Type), token request fields.
- repo: vaultwarden
  path: src/api/identity.rs
  local: src/transport/auth.ts, tests/e2e/run.ts
  sync: Token grant types, 2FA providers, prelogin/register shapes, response casing.
- repo: vaultwarden
  path: src/api/core/accounts.rs
  local: src/transport/auth.ts
  sync: Register/profile/KDF data shapes.
- repo: vaultwarden
  path: src/api/core/ciphers.rs
  local: src/transport/vault.ts, tests/e2e/run.ts
  sync: CipherData required fields (e.g. encryptedFor), sync response shape.
- repo: vaultwarden
  path: src/api/core/mod.rs
  local: src/transport/config.ts
  sync: /api/config version (capability detection) and feature flags.
- repo: clients
  path: libs/common/src/vault/models/domain/login-uri.ts
  local: src/autofill/match.ts
  sync: UriMatchType semantics (Domain default, Host incl. port, StartsWith, Exact, RegularExpression, Never).
- repo: clients
  path: apps/web/src/connectors/webauthn.ts
  local: src/ui/popup.ts (webauthnBox)
  sync: Connector query params (v2 data object, parent), postMessage protocol ("success|", "error|", "info|").
- repo: clients
  path: libs/common/src/platform/services/fido2
  local: src/offscreen/fido2.ts, src/autofill/passkey-page.ts
  sync: fido2Credentials field formats (credentialId, keyValue, counter, discoverable), authenticator flags.
- repo: sdk-internal
  path: crates/bitwarden-send/src
  local: crates/core-wasm/src/send.rs
  sync: Send key derivation, encrypted fields, password hash iterations, file buffer format.
- repo: vaultwarden
  path: src/api/core/sends.rs
  local: src/transport/vault.ts, tests/e2e/run.ts
  sync: SendData fields, file upload flow, send_access token flow.
- repo: vaultwarden
  path: src/api/core/two_factor/webauthn.rs
  local: src/background/account.ts, src/transport/auth.ts
  sync: Login challenge shape, appid extension, challenge lifetime.
- repo: vaultwarden
  path: src/sso.rs
  local: src/background/account.ts (SSO), dev/vaultwarden/mock-idp.mjs
  sync: client_id -> redirect URI table, binding cookie, state handling, SSO_* settings.
- repo: sdk-internal
  path: crates/bitwarden-crypto/src/keys/prf.rs
  local: crates/core-wasm/src/api.rs (prf_protect_user_key, unlock_with_prf), src/ui/biometric.ts
  sync: PRF key derivation (32-byte minimum, zero refusal, quality stretch), WebAuthn PRF options and user-verification requirements.
- repo: sdk-internal
  path: crates/bitwarden-crypto/src/keys/pin_key.rs
  local: crates/core-wasm/src/api.rs (pin_protect_user_key, unlock_with_pin), src/background/account.ts (PIN)
  sync: PIN key derivation (KDF + stretch), wrapped user key format, ephemeral vs persistent PIN storage.
- repo: sdk-internal
  path: crates/bitwarden-vault/src/cipher/attachment.rs
  local: crates/core-wasm/src/cipher.rs (decrypt_attachment, encrypt_attachment)
  sync: Attachment key wrapping (cipher key vs org/user key), body format, keyless legacy attachments.
- repo: sdk-internal
  path: crates/bitwarden-generators/src/username.rs
  local: src/offscreen/vault.ts (generate)
  sync: Username types (word, subaddress, catch-all), random string length/charset, number suffix.
- repo: clients
  path: libs/tools/export-vault-core/src/services/individual-vault-export.service.ts
  local: src/offscreen/vault.ts (exportJson)
  sync: Bitwarden JSON export format (item fields, folders, encrypted flag).
- repo: clients
  path: libs/importer/src/importers/bitwarden/bitwarden-json-importer.ts
  local: src/offscreen/vault.ts (prepareImport)
  sync: Accepted JSON shape, folder relationships, which fields are dropped.
- repo: clients
  path: libs/common/src/autofill/services/autofill-settings.service.ts
  local: src/shared/messages.ts (Settings), src/background/store.ts (getSettings)
  sync: Defaults and value domains (inline menu visibility, clear-clipboard delay, autofill-on-page-load + its default), per-item tri-state behaviour.
- repo: clients
  path: libs/common/src/autofill/services/domain-settings.service.ts
  local: src/background/autofill.ts (matches), src/offscreen/vault.ts (matchUri)
  sync: Default URI match strategy and its resolution for URIs without their own `match`.
- repo: clients
  path: libs/vault/src/cipher-form/components/autofill-options
  local: src/ui/vault.ts (uriEditor, autofillOnPageLoad select)
  sync: Per-URI match detection options (Default / Base domain / Host / Exact / Never / Starts with / RegExp), tri-state autofill-on-page-load.
- repo: clients
  path: apps/browser/src/autofill/background/autofill-orchestrator.ts
  local: src/background/autofill.ts (pageLoadFill), src/shared/pageload.ts
  sync: Page-load cipher selection (per-item filter, last used/launched), only-empty-fields rule, TOTP copy behaviour.
- repo: clients
  path: apps/browser/src/platform/services/browser-clipboard.service.ts
  local: src/background/vault.ts (scheduleClipboardClear)
  sync: Clear-clipboard delay options and the "never" case.
- repo: clients
  path: apps/browser/src/autofill/popup/settings/autofill.component.ts
  local: src/ui/popup.ts (settingsTab)
  sync: Option lists (clear clipboard, default URI match, autofill on page load), context-menu toggle, cards/identities visibility.
