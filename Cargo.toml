[workspace]
resolver = "3"
members = [
  "crates/core-wasm",
  "crates/autofill-core",
  "crates/autofill-cpd",
  "crates/autofill-designation",
  "crates/autofill-clue",
  "crates/autofill-resolver",
  "crates/autofill-autocomplete-off",
  "crates/autofill-fill",
  "crates/autofill-autosubmit",
]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
regex-lite = "0.1"
autofill-cpd = { path = "crates/autofill-cpd" }
autofill-designation = { path = "crates/autofill-designation" }
autofill-clue = { path = "crates/autofill-clue" }
autofill-resolver = { path = "crates/autofill-resolver" }
autofill-autocomplete-off = { path = "crates/autofill-autocomplete-off" }
autofill-fill = { path = "crates/autofill-fill" }
autofill-autosubmit = { path = "crates/autofill-autosubmit" }

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Native test builds: KDFs (PBKDF2 600k, Argon2id 64 MiB) are unusably slow unoptimized.
[profile.test]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
