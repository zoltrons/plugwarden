name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; a job that needs more says so itself.
permissions: {}

# A newer push to the same PR supersedes the running one; main runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install # version, components and wasm target come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: sdk-internal rev in Cargo.toml matches upstream.lock
        run: |
          rev=$(awk '/^\[sdk-internal\]/{s=1} s&&/^rev/{gsub(/"/,"",$3); print $3; exit}' upstream.lock)
          test "$(grep -c "rev = \"$rev\"" crates/core-wasm/Cargo.toml)" -ge 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: bash tools/fetch-test-vectors.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: PW_TEST_VECTORS=target/test-vectors cargo test -p plugwarden-core-wasm
      - run: cargo test -p autofill-designation -p autofill-cpd -p autofill-clue -p autofill-autocomplete-off -p autofill-resolver -p autofill-autosubmit -p autofill-fill

  # RustSec / npm advisories can go red on an unchanged tree when a new advisory lands, so this
  # job stays out of the `ci` gate: it warns, it does not block merges.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check advisories }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npm audit --audit-level=high

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache also keeps ~/.cargo/bin, and `cargo install` of an already installed version is a no-op.
      - run: cargo install wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "\(.*\)".*/\1/p' upstream.lock)" --locked
      - run: npm ci
      - run: npm i -g binaryen@132.0.0 && bash tools/build-wasm.sh --simd
      - run: node tools/fetch-psl.mjs && npm run typecheck
      - name: unit tests with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: size report (fails over budget)
        shell: bash # explicit bash adds pipefail, so tee does not hide a budget failure
        run: npm run size | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npx playwright-core install --with-deps chromium
      - name: autofill field-detection smoke test (no server)
        run: npm run test:fill
      - name: biometric smoke test (virtual PRF authenticator, no server)
        run: |
          bash tools/build-wasm.sh --features register --out dist/wasm-register
          npm run test:biometric
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage/lcov.info }
      # The unpacked build of this exact commit, for sideloading when reviewing a PR.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension, path: dist/ext }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: |
            dist/wasm
            dist/wasm-register

  e2e:
    needs: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a healthy run takes ~5 min; a hung browser call must not burn 6 h
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        vaultwarden: ["1.37.4", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npx playwright-core install --with-deps chromium
      - run: VW_TAG=${{ matrix.vaultwarden }} docker compose -f dev/vaultwarden/docker-compose.yml up -d --wait
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wasm, path: dist }
      - run: node tools/fetch-psl.mjs && node tools/build.mjs --e2e
      - run: npm run test:e2e
      - name: vaultwarden logs
        if: failure()
        run: docker compose -f dev/vaultwarden/docker-compose.yml logs --no-color --tail 200

  # Fan-in: branch protection requires only this check, so adding a job means adding it here.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [workflows, core, extension, e2e]
    if: always()
    steps:
      - name: every blocking job succeeded
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          for r in $RESULTS; do test "$r" = success || { echo "::error::a required job finished as '$r'"; exit 1; }; done
