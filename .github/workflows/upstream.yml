name: upstream
# Weekly read-only report of upstream changes since the pins in upstream.lock.
# Pin bumps come as Renovate PRs (renovate.json), which run ci.yml (vectors, e2e matrix, size).
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node tools/sync-upstream.mjs >> "$GITHUB_STEP_SUMMARY"
        env: { GH_TOKEN: "${{ github.token }}" }
