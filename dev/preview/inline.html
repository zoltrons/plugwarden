<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Inline menu preview</title>
  <style>
    :root { color-scheme: light; --page: #f3f4f6; --card: #fff; --text: #1f2430; --muted: #6b7280; --line: #e5e7eb; --brand: #3f5bd9; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --page: #101318; --card: #191d25; --text: #eef1f6; --muted: #9aa3b2; --line: #2a3040; --brand: #7d95ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    header .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    header strong { font-size: 15px; }
    header nav { margin-left: auto; display: flex; gap: 18px; color: var(--muted); font-size: 13px; }
    main { display: grid; place-items: center; padding: 48px 24px; }
    .card { width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.08); }
    h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.2px; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
    .row { margin-bottom: 16px; }
    .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .actions a { color: var(--brand); font-size: 13px; text-decoration: none; }
    button { height: 38px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <span class="mark">A</span>
    <strong>Acme Workspace</strong>
    <nav><span>Products</span><span>Pricing</span><span>Docs</span></nav>
  </header>
  <main>
    <form class="card">
      <h1>Sign in</h1>
      <p class="sub">Use your Acme account to continue.</p>
      <div class="row">
        <label for="user">Email</label>
        <input id="user" type="text" value="ada@example.com" autocomplete="username" spellcheck="false">
      </div>
      <div class="row">
        <label for="pass">Password</label>
        <input id="pass" type="password" value="correct horse battery" autocomplete="current-password">
      </div>
      <div class="actions">
        <a href="#">Forgot password?</a>
        <button type="button">Continue</button>
      </div>
    </form>
  </main>
  <script type="module">
    // Mirrors the content script: the menu is an iframe under the focused field, sized by row count,
    // with the same 4 px offset, shadow and radius.
    const rows = 3;
    const field = document.getElementById("user");
    field.focus();
    field.setSelectionRange(field.value.length, field.value.length);
    const r = field.getBoundingClientRect();
    const frame = document.createElement("iframe");
    frame.src = "menu.html";
    frame.style.cssText = `all:initial;display:block;width:100%;height:${Math.min(rows, 5) * 45 + 13}px;border:0;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);color-scheme:normal`;
    const host = document.createElement("div");
    host.style.cssText = `all:initial;position:fixed;z-index:2147483647;display:block;top:${r.bottom + 4}px;left:${r.left}px;width:${Math.max(r.width, 300)}px`;
    host.append(frame);
    document.documentElement.append(host);
  </script>
</body>
</html>
