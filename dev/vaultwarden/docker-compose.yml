# Local Vaultwarden for the e2e contract tests.
# Test-only fixture: signups are open and there is no admin token. Never expose beyond 127.0.0.1.
#   VW_TAG=1.37.4 docker compose up -d     (pinned, see upstream.lock)
#   VW_TAG=latest docker compose up -d     (matrix leg)
name: plugwarden-vw

services:
  vaultwarden:
    image: vaultwarden/server:${VW_TAG:-1.37.4}
    restart: "no"
    ports:
      - "127.0.0.1:${VW_PORT:-8080}:80"
      - "127.0.0.1:9090:9090" # mock IdP (shares this network namespace)
    environment:
      DOMAIN: "http://localhost:${VW_PORT:-8080}"
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_VERIFY: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      # Do not ratelimit the test harness.
      LOGIN_RATELIMIT_MAX_BURST: "1000"
      LOGIN_RATELIMIT_SECONDS: "1"
      UNAUTHENTICATED_RATELIMIT_MAX_BURST: "1000" # registration / prelogin / send-email-login
      UNAUTHENTICATED_RATELIMIT_SECONDS: "1"
      LOG_LEVEL: "warn"
      # SSO against the mock IdP below (password login stays available: SSO_ONLY is false).
      SSO_ENABLED: "true"
      SSO_AUTHORITY: "http://localhost:9090"
      SSO_CLIENT_ID: "vaultwarden"
      SSO_CLIENT_SECRET: "test-only-secret"
    volumes:
      - vw-data:/data

  mock-idp:
    image: node:24-alpine
    restart: "no"
    network_mode: "service:vaultwarden" # same localhost as the server, so one issuer URL works for both
    command: ["node", "/idp/mock-idp.mjs"]
    volumes:
      - ./mock-idp.mjs:/idp/mock-idp.mjs:ro

volumes:
  vw-data:
